# Weave fork CI: install and compile the IDE on GitHub-hosted macOS runners.
# Upstream's own workflows target Microsoft's private runners and are disabled in this fork.
name: Weave build

on:
  push:
    branches: [main, 'weave/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: weave-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    name: Compile (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/Library/pnpm/store
          key: weave-pnpm-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: weave-pnpm-macos-

      - name: Install dependencies
        run: |
          set -e
          python3 -m pip install --break-system-packages setuptools
          for i in 1 2 3; do
            pnpm install --frozen-lockfile && break
            if [ $i -eq 3 ]; then echo "pnpm install failed too many times" >&2; exit 1; fi
            echo "pnpm install failed ($i), retrying..."
          done

      - name: Check branding
        run: node -e "const p=require('./product.json'); if (p.nameShort !== 'Weave') { console.error('product.json is not branded as Weave'); process.exit(1); }"

      - name: Compile
        run: pnpm run compile
